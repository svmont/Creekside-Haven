name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, not one, and the reason is not style. deploy-pages asks the
# artifact API for the artifact that upload-pages-artifact has just finished
# writing, and that index is eventually consistent: on 2026-11-20 it answered
# "Found 0 artifact(s)" twice in an afternoon for an upload the log shows
# succeeding seconds earlier. A job boundary puts the whole of the build job's
# teardown between the write and the read.
#
# It also makes a re-run safe. While both steps lived in one job, re-running
# the failed job uploaded a SECOND artifact named github-pages into the same
# run, and deploy-pages then failed on "Multiple artifacts ... Artifact count
# is 2" -- a run in that state can never go green. Now the failing job is
# deploy, which uploads nothing, so re-running just that job is the fix.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static and lives at the repo root.
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
